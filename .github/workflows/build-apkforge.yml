              val pm = ctx.packageManager
              var label = name
              var pkg = ""
              val info = pm.getPackageArchiveInfo(dst.path, 0)
              if (info != null) {
                  pkg = info.packageName ?: ""
                  info.applicationInfo?.let { ai ->
                      ai.sourceDir = dst.path
                      ai.publicSourceDir = dst.path
                      label = ai.loadLabel(pm).toString()
