          private fun importApk(ctx: Context, uri: Uri): PickedApk {
              val name = ctx.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c ->
                  if (c.moveToFirst()) c.getString(0) else null
              } ?: "app.apk"
              val dst = File(ctx.cacheDir, "input.apk")
              val input = ctx.contentResolver.openInputStream(uri) ?: error("Fichier illisible")
              input.use { i -> dst.outputStream().use { o -> i.copyTo(o, 256 * 1024) } }
              val already = try {
                  ApkZip(dst).use { z ->
                      if (z.find("AndroidManifest.xml") == null) throw IllegalStateException("AndroidManifest.xml absent")
