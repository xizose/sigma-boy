# À placer dans : .github/workflows/build-apkforge.yml
# Nécessite aussi le fichier apkforge-project.zip à la racine du repo (envoyé via "Add file > Upload files").

name: Build APK Forge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Décompresser le projet
        run: |
          set -e
          test -f apkforge-project.zip || { echo "apkforge-project.zip est absent du repo"; exit 1; }
          unzip -o apkforge-project.zip
          find . -name "*.kt" -o -name "*.java" | head -20

      - name: Compiler le module hook en dex
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AJ="$ANDROID_HOME/platforms/android-34/android.jar"
          mkdir -p hook/cls hook/out hook/lib app/src/main/assets
          curl -fL -o hook/lib/hab.aar https://repo1.maven.org/maven2/org/lsposed/hiddenapibypass/hiddenapibypass/6.1/hiddenapibypass-6.1.aar
          unzip -o -q hook/lib/hab.aar classes.jar -d hook/lib
          javac -XDstringConcat=inline -cp "$AJ:hook/lib/classes.jar" -d hook/cls hook/patch/TweakProvider.java
          "$BT/d8" --release --min-api 21 --lib "$AJ" --output hook/out $(find hook/cls -name '*.class') hook/lib/classes.jar
          cp hook/out/classes.dex app/src/main/assets/hook.dex

      - name: Restaurer les clés de signature
        uses: actions/cache@v4
        with:
          path: |
            signing
            ~/.android/debug.keystore
          key: apkforge-keys-v1

      - name: Préparer la clé qui signera les APK exportés
        run: |
          set -e
          if [ ! -f signing/key.pk8 ]; then
            mkdir -p signing
            openssl req -x509 -newkey rsa:2048 -nodes -keyout signing/key.pem -out signing/cert.pem -days 36500 -subj "/CN=APK Forge"
            openssl pkcs8 -topk8 -nocrypt -in signing/key.pem -outform DER -out signing/key.pk8
            openssl x509 -in signing/cert.pem -outform DER -out signing/cert.der
          fi
          cp signing/key.pk8 app/src/main/assets/sign.key.pk8
          cp signing/cert.der app/src/main/assets/sign.cert.der

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'appli
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: APK-Forge
          path: app/build/outputs/apk/debug/app-debug.apk

