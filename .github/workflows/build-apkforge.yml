# À placer dans : .github/workflows/build-apkforge.yml
#
# Ce workflow génère tout seul le projet Android "APK Forge" et le compile.
# Résultat : une appli (APK) où tu importes un APK, règles saturation / étirement /
# résolution avec des curseurs, puis exportes l'APK modifié (signé) sur la tablette.
# Aucun ordinateur, aucun ADB, aucun débogage.
#
# Lancement : Actions > Build APK Forge > Run workflow, puis télécharger "APK-Forge" dans Artifacts.

name: Build APK Forge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Écrire le projet Android
        run: |
          set -e
          cat > settings.gradle.kts <<'FORGE_EOF_1'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ApkForge"
          include(":app")
          FORGE_EOF_1
          cat > build.gradle.kts <<'FORGE_EOF_2'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          FORGE_EOF_2
          cat > gradle.properties <<'FORGE_EOF_3'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          FORGE_EOF_3
          mkdir -p app
          cat > app/build.gradle.kts <<'FORGE_EOF_4'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.apkforge"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.apkforge"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging { resources.excludes += setOf("/META-INF/{AL2.0,LGPL2.1}", "META-INF/DEPENDENCIES") }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.android.tools.build:apksig:8.5.2")
          }
          FORGE_EOF_4
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FORGE_EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="APK Forge"
                  android:largeHeap="true"
                  android:theme="@style/Theme.Forge">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          FORGE_EOF_5
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'FORGE_EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Forge" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0B0F14</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
              <color name="forge_bg">#123B34</color>
          </resources>
          FORGE_EOF_6
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'FORGE_EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="exports_ext" path="exports/" />
              <files-path name="exports_int" path="exports/" />
