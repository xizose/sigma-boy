          cat > app/src/main/java/com/apkforge/AxmlPatcher.java <<'FORGE_EOF_10'
          package com.apkforge;

          import java.io.ByteArrayOutputStream;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          /** Ajoute un <provider> dans un AndroidManifest.xml binaire (AXML), sans rien décompiler. */
          public final class AxmlPatcher {
              private static final int T_XML = 0x0003, T_POOL = 0x0001, T_RESMAP = 0x0180;
              private static final int T_START_NS = 0x0100, T_END_NS = 0x0101, T_START_EL = 0x0102, T_END_EL = 0x0103, T_CDATA = 0x0104;
              private static final String ANDROID_NS = "http://schemas.android.com/apk/res/android";
              private static final int ID_NAME = 0x01010003, ID_EXPORTED = 0x01010010, ID_AUTHORITIES = 0x01010018;

              private AxmlPatcher() {}

              private static int i32(byte[] b, int p) { return ByteBuffer.wrap(b, p, 4).order(ByteOrder.LITTLE_ENDIAN).getInt(); }
              private static int u16(byte[] b, int p) { return (b[p] & 0xFF) | ((b[p + 1] & 0xFF) << 8); }
              private static void p32(byte[] b, int p, int v) { b[p] = (byte) v; b[p + 1] = (byte) (v >> 8); b[p + 2] = (byte) (v >> 16); b[p + 3] = (byte) (v >> 24); }
              private static void p16(byte[] b, int p, int v) { b[p] = (byte) v; b[p + 1] = (byte) (v >> 8); }
              private static void w32(ByteArrayOutputStream o, int v) { o.write(v); o.write(v >> 8); o.write(v >> 16); o.write(v >> 24); }
              private static void w16(ByteArrayOutputStream o, int v) { o.write(v); o.write(v >> 8); }

              private static final class Chunk { int type; byte[] data; Chunk(int t, byte[] d) { type = t; data = d; } }

              // ---------- chaînes ----------
              private static String readStr(byte[] b, int pos, boolean utf8) {
                  if (utf8) {
                      int p = pos;
                      int n16 = b[p++] & 0xFF; if ((n16 & 0x80) != 0) n16 = ((n16 & 0x7F) << 8) | (b[p++] & 0xFF);
                      int n8 = b[p++] & 0xFF; if ((n8 & 0x80) != 0) n8 = ((n8 & 0x7F) << 8) | (b[p++] & 0xFF);
                      return new String(b, p, n8, StandardCharsets.UTF_8);
