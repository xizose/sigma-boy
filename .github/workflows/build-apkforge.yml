                  w16(en, T_END_EL); w16(en, 16); w32(en, 24); w32(en, 1); w32(en, -1); w32(en, -1); w32(en, idxProvider);

                  chunks.add(appEnd, new Chunk(T_END_EL, en.toByteArray()));
                  chunks.add(appEnd, new Chunk(T_START_EL, st.toByteArray()));

                  // nouveau pool + resmap
                  chunks.set(poolIdx, new Chunk(T_POOL, buildPool(ns, utf8)));
