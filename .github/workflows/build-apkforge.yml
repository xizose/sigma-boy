          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'FORGE_EOF_9'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/forge_bg" />
              <foreground android:drawable="@drawable/ic_forge_fg" />
          </adaptive-icon>
          FORGE_EOF_9
