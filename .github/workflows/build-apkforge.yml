                      drawRect(Color(0xFF8CF0C4), Offset(w / 2f - pw / 2f, h * 0.8f - ph), Size(pw, ph))
                      val r = lane * 0.18f
                      drawOval(Color(0xFFFFB86B), Offset(lane * 0.5f - r * sx, h * 0.3f - r * sy), Size(2f * r * sx, 2f * r * sy))
                  }
              }
          }

          @Composable
          private fun ForgeApp() {
              val ctx = LocalContext.current
              val view = LocalView.current
              val scope = rememberCoroutineScope()
              val prefs = remember { ctx.getSharedPreferences("forge", Context.MODE_PRIVATE) }

              var settings by remember {
                  mutableStateOf(TweakSettings(prefs.getFloat("sat", 1f), prefs.getInt("v", 0), prefs.getInt("h", 0), prefs.getInt("res", 0)))
              }
              var picked by remember { mutableStateOf<PickedApk?>(null) }
              var importing by remember { mutableStateOf(false) }
              var running by remember { mutableStateOf(false) }
              var step by remember { mutableStateOf(Step.READ) }
              var progress by remember { mutableStateOf(0f) }
              var elapsedMs by remember { mutableStateOf(0L) }
              var result by remember { mutableStateOf<PatchResult?>(null) }
              var error by remember { mutableStateOf<String?>(null) }
              var history by remember { mutableStateOf(History.load(prefs)) }

              fun update(s: TweakSettings) {
                  settings = s
                  prefs.edit().putFloat("sat", s.sat).putInt("v", s.stretchV).putInt("h", s.stretchH).putInt("res", s.renderLong).apply()
              }

              DisposableEffect(running) {
                  view.keepScreenOn = running
                  onDispose { view.keepScreenOn = false }
              }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
                  if (uri != null) {
                      importing = true
                      error = null
                      result = null
                      scope.launch {
                          try {
                              picked = withContext(Dispatchers.IO) { importApk(ctx, uri) }
                          } catch (e: Exception) {
                              picked = null
                              error = e.message ?: "Import impossible"
                          }
                          importing = false
                      }
                  }
              }

              fun startExport() {
                  val p = picked ?: return
                  val s = settings
                  running = true
                  result = null
                  error = null
                  progress = 0f
                  step = Step.READ
                  elapsedMs = 0L
                  scope.launch {
                      val t0 = System.nanoTime()
                      val ticker = launch {
                          while (true) {
                              elapsedMs = (System.nanoTime() - t0) / 1_000_000
                              delay(100)
                          }
                      }
                      try {
                          val safe = p.label.replace(Regex("[^A-Za-z0-9]+"), "_").trim('_').ifEmpty { "app" }
                          val out = File(PatchEngine.exportDir(ctx), "${safe}_forge_${System.currentTimeMillis() / 1000}.apk")
                          val r = withContext(Dispatchers.IO) {
                              PatchEngine.run(ctx, p.file, out, s) { st, pr -> step = st; progress = pr }
                          }
                          result = r
                          elapsedMs = r.millis
                          History.add(prefs, HistItem(p.label, r.millis, r.sizeBytes, s.summary(), r.file.path))
                          history = History.load(prefs)
                      } catch (e: Throwable) {
                          error = "Échec : " + (e.message ?: e.javaClass.simpleName)
                      }
                      ticker.cancel()
                      running = false
                  }
              }

              Box(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)) {
                  Column(
                      Modifier.fillMaxSize().systemBarsPadding().verticalScroll(rememberScrollState()).padding(16.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      Box(
                          Modifier.fillMaxWidth().clip(RoundedCornerShape(28.dp))
                              .background(Brush.linearGradient(listOf(Color(0xFF123B34), Color(0xFF1B2A55)))).padding(22.dp)
                      ) {
                          Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                              Text("APK Forge", fontSize = 30.sp, fontWeight = FontWeight.ExtraBold, color = Color.White)
                              Text("Résolution étirée · saturation, directement dans l'APK.", color = Color(0xFFB9C7D6), fontSize = 14.sp)
                          }
                      }

                      SectionCard("Choisir l'APK", "1") {
                          Button(
                              onClick = { picker.launch(arrayOf("*/*")) },
                              enabled = !running && !importing,
                              modifier = Modifier.fillMaxWidth().height(52.dp),
                              shape = RoundedCornerShape(16.dp)
                          ) { Text(if (picked == null) "Importer un APK" else "Changer d'APK", fontWeight = FontWeight.Bold) }
                          if (importing) {
                              LinearProgressIndicator(Modifier.fillMaxWidth())
                              Text("Lecture du fichier…", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                          picked?.let { p ->
                              Text(p.label, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                              Text("${p.pkg} · ${fmtSize(p.size)}", color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 13.sp)
                              if (p.alreadyPatched) {
                                  Text("Déjà modifié : seuls les réglages seront remplacés.", color = MaterialTheme.colorScheme.secondary, fontSize = 13.sp)
                              }
                          }
                      }

                      SectionCard("Réglages", "2") {
                          Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              for ((name, preset) in PRESETS) {
                                  FilterChip(selected = settings == preset, onClick = { update(preset) }, label = { Text(name) })
                              }
                          }

                          LabeledSlider(
                              "Saturation", String.format(Locale.US, "x%.1f", settings.sat), settings.sat, 1f..2.5f, 14
                          ) { update(settings.copy(sat = (it * 10f).roundToInt() / 10f)) }
                          SatPreview(settings.sat)

                          Row(horizontalArrangement = Arrangement.spacedBy(16.dp), verticalAlignment = Alignment.CenterVertically) {
                              StretchPreview(settings.sx, settings.sy)
                              Column(Modifier.weight(1f)) {
                                  LabeledSlider("Étirement vertical", "+${settings.stretchV * 10} %", settings.stretchV.toFloat(), 0f..3f, 2) {
                                      update(settings.copy(stretchV = it.roundToInt()))
                                  }
                                  LabeledSlider("Étirement horizontal", "+${settings.stretchH * 10} %", settings.stretchH.toFloat(), 0f..3f, 2) {
                                      update(settings.copy(stretchH = it.roundToInt()))
                                  }
                              }
                          }

                          Text(
                              "Étirement : le jeu est calculé dans une résolution plus étroite / basse, puis étiré sur tout l'écran (comme la résolution étirée).",
                              fontSize = 13.sp, color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                          Text("Résolution de rendu (côté long)", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              for (r in RES_OPTIONS) {
                                  FilterChip(
                                      selected = settings.renderLong == r,
                                      onClick = { update(settings.copy(renderLong = r)) },
                                      label = { Text(if (r == 0) "Natif" else "$r px") }
                                  )
                              }
                          }
                          val dm = ctx.resources.displayMetrics
                          val sw = dm.widthPixels
                          val sh = dm.heightPixels
                          val longSide = max(sw, sh)
                          val f = if (settings.renderLong in 1 until longSide) settings.renderLong.toFloat() / longSide else 1f
                          val bw = (sw * f / settings.sx).roundToInt()
                          val bh = (sh * f / settings.sy).roundToInt()
                          if (bw < sw || bh < sh) {
                              val saved = ((1f - (bw.toFloat() * bh) / (sw.toFloat() * sh)) * 100).roundToInt()
                              Text(
                                  "Rendu ≈ ${bw}×${bh} au lieu de ${sw}×${sh} (−$saved % de pixels, plus de FPS).",
                                  fontSize = 13.sp, color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }
                      }

                      SectionCard("Export", "3") {
                          if (!running) {
                              Button(
                                  onClick = { startExport() },
                                  enabled = picked != null && !importing,
                                  modifier = Modifier.fillMaxWidth().height(56.dp),
                                  shape = RoundedCornerShape(18.dp)
                              ) {
                                  Text(
                                      if (picked?.alreadyPatched == true) "Mettre à jour les réglages" else "Exporter l'APK modifié",
                                      fontWeight = FontWeight.Bold, fontSize = 16.sp
                                  )
                              }
                          } else {
                              Text(step.label, fontWeight = FontWeight.SemiBold)
                              if (step == Step.SIGN) {
                                  LinearProgressIndicator(Modifier.fillMaxWidth().height(10.dp).clip(RoundedCornerShape(5.dp)))
                              } else {
                                  LinearProgressIndicator(
                                      progress = { progress },
                                      modifier = Modifier.fillMaxWidth().height(10.dp).clip(RoundedCornerShape(5.dp))
                                  )
                              }
                              val eta = if (progress > 0.12f && progress < 0.99f && step != Step.SIGN) ((elapsedMs * (1f - progress) / progress) / 1000f).roundToInt() else -1
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("⏱ " + fmtTime(elapsedMs), fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                                  Text(if (eta >= 0) "≈ $eta s restantes" else "${(progress * 100).roundToInt()} %", color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                          }
                          error?.let { Text(it, color = MaterialTheme.colorScheme.error) }
                          result?.let { r ->
                              Text(
                                  "✅ Terminé en ${fmtTime(r.millis)} · ${fmtSize(r.sizeBytes)}",
                                  fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary
                              )
                              Text("Désinstalle d'abord le jeu d'origine : l'APK modifié est signé avec une autre clé.", fontSize = 13.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(onClick = { installApk(ctx, r.file) }, shape = RoundedCornerShape(14.dp)) { Text("Installer") }
                                  OutlinedButton(onClick = { shareApk(ctx, r.file) }, shape = RoundedCornerShape(14.dp)) { Text("Partager") }
                                  if (Build.VERSION.SDK_INT >= 29) {
                                      OutlinedButton(onClick = {
                                          val ok = try { saveToDownloads(ctx, r.file) } catch (e: Exception) { false }
                                          Toast.makeText(ctx, if (ok) "Copié dans Téléchargements" else "Copie impossible", Toast.LENGTH_SHORT).show()
                                      }, shape = RoundedCornerShape(14.dp)) { Text("Télécharg.") }
                                  }
                              }
                          }
                      }

                      if (history.isNotEmpty()) {
                          SectionCard("Historique", "★") {
                              for (h in history) {
                                  val f = File(h.path)
                                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                                      Column(Modifier.weight(1f)) {
                                          Text(h.name, fontWeight = FontWeight.SemiBold)
                                          Text("${h.summary} · ${fmtTime(h.ms)} · ${fmtSize(h.size)}", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                      }
                                      if (f.exists()) {
                                          OutlinedButton(onClick = { installApk(ctx, f) }, shape = RoundedCornerShape(12.dp)) { Text("Installer") }
                                      }
                                  }
                              }
                          }
                      }
                      Box(Modifier.height(24.dp))
                  }
              }
          }
          FORGE_EOF_13
          mkdir -p hook/patch
          cat > hook/patch/TweakProvider.java <<'FORGE_EOF_14'
          package patch;

          import android.app.Activity;
          import android.app.Application;
          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.SurfaceView;
          import android.view.TextureView;
          import android.view.View;
          import android.view.ViewGroup;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Map;
          import java.util.WeakHashMap;
          import org.json.JSONObject;

          /** Module injecté par APK Forge : lit assets/apkforge.json et applique résolution, étirement et saturation. */
          public class TweakProvider extends ContentProvider {
              static float sat = 1f, sx = 1f, sy = 1f;
              static int render = 0;

              @Override public boolean onCreate() {
                  try {
                      Context c = getContext();
                      load(c);
                      Application app = (c instanceof Application) ? (Application) c : (Application) c.getApplicationContext();
                      app.registerActivityLifecycleCallbacks(new Callbacks());
                  } catch (Throwable t) { /* ne jamais faire planter le jeu */ }
                  return true;
              }

              static void load(Context c) throws Exception {
                  InputStream in = c.getAssets().open("apkforge.json");
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[1024]; int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  in.close();
                  JSONObject j = new JSONObject(new String(bo.toByteArray(), "UTF-8"));
                  sat = (float) j.optDouble("sat", 1.0);
                  sx = (float) j.optDouble("sx", 1.0);
                  sy = (float) j.optDouble("sy", 1.0);
                  render = j.optInt("render", 0);
              }

              static final class Callbacks implements Application.ActivityLifecycleCallbacks {
                  public void onActivityCreated(Activity a, Bundle b) { schedule(a); }
                  public void onActivityStarted(Activity a) {}
                  public void onActivityResumed(Activity a) { schedule(a); }
                  public void onActivityPaused(Activity a) {}
                  public void onActivityStopped(Activity a) {}
                  public void onActivitySaveInstanceState(Activity a, Bundle b) {}
                  public void onActivityDestroyed(Activity a) {}
              }

              static void schedule(final Activity a) {
                  final Handler h = new Handler(Looper.getMainLooper());
                  h.post(new Runnable() {
                      int tries = 0, checks = 0;
                      public void run() {
                          try {
                              List<View> found = new ArrayList<View>();
                              collect(a.getWindow().getDecorView(), found);
                              View best = null; int area = 0;
                              for (View v : found) {
                                  int s = v.getWidth() * v.getHeight();
                                  if (s > area) { area = s; best = v; }
                              }
                              if (best != null) {
                                  tweak(best);
                                  // Unity peut remettre sa taille d'origine : on revérifie pendant ~12 s
                                  if (checks++ < 12) h.postDelayed(this, 1000);
                              } else if (tries++ < 80) {
                                  h.postDelayed(this, 250);
                              }
                          } catch (Throwable t) { }
                      }
                  });
              }

              static void collect(View v, List<View> out) {
                  if (v instanceof SurfaceView || v instanceof TextureView) out.add(v);
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) collect(g.getChildAt(i), out);
                  }
              }

              /**
               * Résolution étirée : le jeu dessine dans un buffer plus petit / d'un autre ratio, et Android l'étire
               * sur toute la vue (aucune transformation de vue, donc aucune bande noire).
               */
              static void tweak(View v) {
                  if (!(v instanceof SurfaceView)) {
                      if (sat != 1f) { // TextureView : le filtre de saturation fonctionne
                          ColorMatrix cm = new ColorMatrix(); cm.setSaturation(sat);
                          Paint p = new Paint(); p.setColorFilter(new ColorMatrixColorFilter(cm));
                          v.setLayerType(View.LAYER_TYPE_HARDWARE, p);
                      }
                      return;
                  }
                  SurfaceView sv = (SurfaceView) v;
                  int w = sv.getWidth(), h = sv.getHeight();
                  if (w <= 0 || h <= 0) return;
                  float f = 1f;
                  if (render > 0) {
                      int longSide = Math.max(w, h);
                      if (render < longSide) f = (float) render / longSide;
                  }
                  int tw = Math.max(1, Math.round(w * f / sx));
                  int th = Math.max(1, Math.round(h * f / sy));
                  if (tw >= w && th >= h) return;
                  android.graphics.Rect cur = sv.getHolder().getSurfaceFrame();
                  if (cur.width() != tw || cur.height() != th) sv.getHolder().setFixedSize(tw, th);
              }

              @Override public Cursor query(Uri u, String[] p, String s, String[] a, String o) { return null; }
              @Override public String getType(Uri u) { return null; }
              @Override public Uri insert(Uri u, ContentValues v) { return null; }
              @Override public int delete(Uri u, String s, String[] a) { return 0; }
              @Override public int update(Uri u, ContentValues v, String s, String[] a) { return 0; }
          }
          FORGE_EOF_14

      - name: Compiler le module hook en dex
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AJ="$ANDROID_HOME/platforms/android-34/android.jar"
          mkdir -p hook/cls hook/out app/src/main/assets
          javac --release 8 -cp "$AJ" -d hook/cls hook/patch/TweakProvider.java
          "$BT/d8" --release --min-api 21 --lib "$AJ" --output hook/out $(find hook/cls -name '*.class')
          cp hook/out/classes.dex app/src/main/assets/hook.dex

      - name: Restaurer les clés de signature
        uses: actions/cache@v4
        with:
          path: |
            signing
            ~/.android/debug.keystore
          key: apkforge-keys-v1

      - name: Préparer la clé qui signera les APK exportés
        run: |
          set -e
          if [ ! -f signing/key.pk8 ]; then
            mkdir -p signing
            openssl req -x509 -newkey rsa:2048 -nodes -keyout signing/key.pem -out signing/cert.pem -days 36500 -subj "/CN=APK Forge"
            openssl pkcs8 -topk8 -nocrypt -in signing/key.pem -outform DER -out signing/key.pk8
            openssl x509 -in signing/cert.pem -outform DER -out signing/cert.der
          fi
          cp signing/key.pk8 app/src/main/assets/sign.key.pk8
          cp signing/cert.der app/src/main/assets/sign.cert.der

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'appli
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: APK-Forge
          path: app/build/outputs/apk/debug/app-debug.apk
