                      ByteArrayOutputStream mo = new ByteArrayOutputStream();
                      w16(mo, T_RESMAP); w16(mo, 8); w32(mo, 8 + 4 * nids.size());
                      for (int id : nids) w32(mo, id);
                      chunks.set(mapIdx, new Chunk(T_RESMAP, mo.toByteArray()));
                  }

                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  w16(out, T_XML); w16(out, 8); w32(out, 0);
                  for (Chunk c : chunks) out.write(c.data, 0, c.data.length);
                  byte[] res = out.toByteArray();
                  p32(res, 4, res.length);
                  return res;
              }
          }
